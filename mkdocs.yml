site_name: evoloop
site_url: https://evoloop.readthedocs.io/en/latest/
site_description: Evolutionary search over the parts of your code you choose, with agents proposing the designs
repo_url: https://github.com/cameo-db/evoloop
repo_name: cameo-db/evoloop
theme:
  logo: assets/evoloop-header.png
  favicon: assets/favicon.png
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
extra_javascript:
  - assets/js/explore.js
extra_css:
  - extra.css
validation:
  links:
    anchors: warn
nav:
  - Home: index.md
  - Start:
      - Run the demo: quickstart.md
      - Set up your search: setting-up.md
      - Write the evaluator: evaluator.md
      - Measure your noise: noise.md
      - Run on a cluster: servers.md
  - Choose a search:
      - Which search should I run?: which-search.md
      - Models:
          - Improve a model's score: guides/model-performance.md
          - Train a fixed architecture better: guides/model-training-recipe.md
          - Tune hyperparameters: guides/settings-tuning.md
          - Adapt a pretrained model: guides/model-finetuning.md
      - Smaller and faster:
          - Find a smaller or faster model: guides/model-efficiency.md
          - Find the best model at several sizes: guides/model-size-frontier.md
          - Distil a student from a teacher: guides/model-distillation.md
      - More particular:
          - Models that fail differently, for an ensemble: guides/model-ensemble-members.md
          - Improve an interpretable or biophysical model: guides/model-mechanistic.md
          - Make an algorithm faster: guides/algorithm-runtime.md
          - Improve a bioinformatics method: guides/bioinformatics-algorithm.md
          - Make a data pipeline faster or cheaper: guides/data-pipeline.md
      - Edit or write a skill: skills.md
  - Concepts:
      - One step of a search: how-it-works.md
      - What gets tried next: schedule.md
      - Who becomes a parent: parents.md
      - Edits, crossover and settings moves: moves.md
      - Cheaper evaluations: early-stopping.md
      - When two scores can be compared: comparable.md
      - The agents, and how much they decide: agents.md
      - Compared with FunSearch and AlphaEvolve: compared.md
  - Run and steer:
      - Watch and steer a run: steering.md
      - Budget and cost: cost.md
      - Working with the strategist: strategist.md
      - Audit the agents: auditing.md
      - Save and deposit the study: study.md
  - Reference:
      - reference.md
      - Commands: commands.md
      - Brief fields: fields.md
      - Options and presets: menu.md
      - Evaluator interface: project-contract.md
      - Skill file format: skill-format.md
      - Files of a run: records.md
      - Skill library: skill-library.md
      - Models and prices: models.md
      - Glossary: glossary.md
      - Status and limits: status.md
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
