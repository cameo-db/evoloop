site_name: evoloop
site_url: https://evoloop.readthedocs.io/en/latest/
site_description: Evolutionary search over the parts of your code you choose, with agents proposing the designs
repo_url: https://github.com/cameo-db/evoloop
repo_name: cameo-db/evoloop
theme:
  logo: assets/evoloop-header.png
  favicon: assets/favicon.png
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
extra_javascript:
  - assets/js/explore.js
extra_css:
  - evoloop-3.css
exclude_docs: |
  generated/
validation:
  links:
    anchors: warn
nav:
  - Home: index.md
  - Get started:
      - Worked example: quickstart.md
      - Set up a search: setting-up.md
      - Write the evaluator: evaluator.md
      - Noise floor: noise.md
      - Run on a cluster: servers.md
  - How it works:
      - Overview: how-it-works.md
      - Agents: agents.md
      - Parent selection: parents.md
      - Schedule: schedule.md
      - Moves: moves.md
      - Early stopping: early-stopping.md
      - Comparing scores: comparable.md
      - Comparison with other AutoResearch methods: compared.md
      - All search options: options.md
  - Run:
      - Monitor and steer a search: steering.md
      - The strategist: strategist.md
      - Audit the agents: auditing.md
      - Budget and cost: cost.md
      - Start from earlier designs: warm-start.md
      - Save and deposit the study: study.md
  - Skills:
      - Choose a skill and a run type: which-search.md
      - Model skills:
          - Improve a model's score: guides/model-performance.md
          - Train a fixed architecture better: guides/model-training-recipe.md
          - Tune hyperparameters: guides/settings-tuning.md
          - Adapt a pretrained model: guides/model-finetuning.md
      - Efficiency skills:
          - Shrink a model: guides/model-efficiency.md
          - Distil a student from a teacher: guides/model-distillation.md
          - Best model at several sizes: guides/model-size-frontier.md
      - Algorithm skills:
          - Make an algorithm faster: guides/algorithm-runtime.md
          - Make a data pipeline faster or cheaper: guides/data-pipeline.md
          - Improve a bioinformatics method: guides/bioinformatics-algorithm.md
      - Other skills:
          - Ensemble members: guides/model-ensemble-members.md
          - Interpretable or biophysical models: guides/model-mechanistic.md
          - Bayesian tuning without agents: guides/settings-tuning-bayesian.md
      - Edit, merge or write a skill: skills.md
  - Reference:
      - reference.md
      - Commands: commands.md
      - Brief fields: fields.md
      - Options and presets: menu.md
      - Evaluator interface: project-contract.md
      - Skill file format: skill-format.md
      - Files of a run: records.md
      - Skill library: skill-library.md
      - Models and prices: models.md
      - Code map: code.md
      - Glossary: glossary.md
      - Limitations: limitations.md
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
