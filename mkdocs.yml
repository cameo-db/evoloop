site_name: evoloop
site_url: https://evoloop.readthedocs.io/en/latest/
site_description: Evolutionary search over the parts of your code you choose, with agents proposing the designs
repo_url: https://github.com/cameo-db/evoloop
repo_name: cameo-db/evoloop
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: {icon: material/weather-sunny, name: Light mode}
extra_css:
  - extra.css
nav:
  - Home: index.md
  - Get started:
      - Run the CPU demo: quickstart.md
      - Use your own project: setting-up.md
      - The evaluator contract: project-contract.md
      - Status and limits: status.md
  - Optimization guides:
      - What do you want to optimize?: guides/index.md
      - The skill library, every skill in full: skill-library.md
      - How skills work, and writing your own: skills.md
      - Tune hyperparameters: guides/settings-tuning.md
      - Improve a model's score: guides/model-performance.md
      - Train a fixed architecture better: guides/model-training-recipe.md
      - Find a smaller or faster model: guides/model-efficiency.md
      - Find the best model at several sizes: guides/model-size-frontier.md
      - Distil a student from a teacher: guides/model-distillation.md
      - Models that fail differently, for an ensemble: guides/model-ensemble-members.md
      - Adapt a pretrained model: guides/model-finetuning.md
      - Improve an interpretable or biophysical model: guides/model-mechanistic.md
      - Make an algorithm faster: guides/algorithm-runtime.md
      - Improve a bioinformatics method: guides/bioinformatics-algorithm.md
      - Make a data pipeline faster or cheaper: guides/data-pipeline.md
  - How it works:
      - How a search works: how-it-works.md
      - How each choice changes the search: choices.md
      - Model and effort: models.md
      - Agentic or harnessed, and what it costs: autonomy.md
      - The strategist and the budget: strategist.md
      - How it compares with established methods: compared.md
  - Run and review:
      - Steering a run: steering.md
      - Records, and saving the study for CAMEO: records.md
      - Auditing the agents: auditing.md
  - Reference:
      - Commands: commands.md
      - Fields of the brief: fields.md
      - Menu of choices and presets: menu.md
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
