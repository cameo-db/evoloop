name: performance
summary: Raise the score by whatever the open blocks allow. The plain search; size and speed are not weighed.
settings: {}
guidance:
  all: |
    The aim is the best validation score. Size, speed and simplicity count only where the person's notes or the
    limits say so.
  writer: |
    Look for what limits the current best before adding to it: capacity (too small to fit), optimisation (fits
    slowly or unstably), or generalisation (fits training data and not validation). Each calls for a different
    kind of change, and `recent` and the lessons usually show which it is.
    A change that helped in one lineage is worth trying in another; one that failed twice in different lineages
    is not worth a third try without a new reason.
    Do not spend a slot on a change smaller than the noise floor can show.
  analyst: |
    Say which kinds of change are still paying and which have stopped. Separate gains that repeat across
    lineages from single results within the noise.
  strategist: |
    A plateau with many near-identical designs calls for more new designs; a plateau with scattered designs and
    one clear leader calls for local work on the leader.
needs: {}
