# The brief of the example: a small search for a formula, with stub agents (no model call, no cost).
# Confirm it with `evoloop brief <dir> --confirm YOUR_NAME`, read `evoloop plan <dir>`, then
# `evoloop run <dir> --name first`.
objective:
  goal: Find a compact formula that predicts y from x0 and x1.
  metric: score
  direction: minimize
run:
  type: explore_then_exploit
  description: ''
budget:
  evaluations: 24
  model_dollars: 0
evaluation:
  allowance: 600
  allowance_unit: steps
  noise: 0.003
  quick_check: python adapter/check.py
  speciality_metrics: {train_mse: minimize}
baseline:
  mode: train
compute:
  gpus: 3
  scheduler: local
agents:
  backend: stub
  stub_module: stub_agents.py
space:
  preset: architecture_and_recipe
data:
  name: synthetic two-input regression (generated by base/data.py)
status:
  confirmed_by: null
  confirmed_on: null
  confirmed_digest: null
