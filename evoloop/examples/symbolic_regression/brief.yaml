# The brief of the example: a small search for a formula, with stub agents (no model call, no cost).
# Confirm it with `evoloop brief <dir> --confirm YOUR_NAME`, read `evoloop plan <dir>`, then
# `evoloop run <dir> --name first`.
objective:
  goal: Find a compact formula that predicts y from x0 and x1.
  metric: val_mse
  direction: minimize
run:
  type: explore_then_exploit
  description: ''
budget:
  evaluations: 24
  model_dollars: 0
evaluation:
  allowance: 600
  allowance_unit: steps
  noise: 0.003
  quick_check: python adapter/check.py
  speciality_metrics: {train_mse: minimize}
  metrics:
    val_mse: mean squared error on the validation points (the score)
    train_mse: mean squared error on the training points
    n_constants: number of fitted constants in the formula
  test_metrics:
    test_mse: mean squared error on the held-out test points
baseline:
  mode: train
compute:
  gpus: 3
  scheduler: local
agents:
  backend: stub
  stub_module: stub_agents.py
space:
  preset: architecture_and_recipe
data:
  name: synthetic two-input regression (generated by base/data.py)
  splits: 800 points, the first 400 for training, the next 200 for validation, the last 200 for test
status:
  asked: [run.skill, data.fraction, limits, evaluation.screen_keep, harness.autonomy, audit.reviews]
  confirmed_by: null
  confirmed_on: null
  confirmed_digest: null
