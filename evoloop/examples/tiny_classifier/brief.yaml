# The brief of the example: a small search for a classifier, with scripted proposals (no model call, no cost).
# Confirm it with `evoloop brief <dir> --confirm YOUR_NAME`, read `evoloop plan <dir>`, then
# `evoloop run <dir> --name first`.
objective:
  goal: Find a small network that separates the two spirals.
  metric: val_accuracy
  direction: maximize
run:
  type: explore_then_exploit
  skill: model-performance
  description: ''
budget:
  evaluations: 40
  model_dollars: 0
evaluation:
  allowance: 300
  allowance_unit: steps
  noise: 0.01
  quick_check: python adapter/check.py
  screen_keep: 1.0
  metrics:
    val_accuracy: share of the validation points classified correctly (the score)
    train_accuracy: share of the training points classified correctly
  test_metrics:
    test_accuracy: share of the held-out test points classified correctly
baseline:
  mode: train
compute:
  gpus: 3
  scheduler: local
agents:
  backend: stub
  stub_module: stub_agents.py
space:
  preset: architecture_and_recipe
data:
  name: two interleaved spirals (generated by base/data.py)
  splits: 1,200 shuffled points, the first 600 for training, the next 300 for validation, the last 300 for test
status:
  asked: [data.fraction, limits, harness.autonomy, audit.reviews]
  confirmed_by: null
  confirmed_on: null
  confirmed_digest: null
